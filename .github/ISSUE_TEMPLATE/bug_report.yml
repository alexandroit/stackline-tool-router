name: Bug report
description: Report incorrect routing, adapter, packaging, or runtime behavior.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For security reports, use the private process in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Browser
        - Node.js
        - Deno
        - Bun
        - Edge runtime
        - Other
    validations:
      required: true
  - type: textarea
    id: catalog
    attributes:
      label: Minimal catalog and query
      description: Remove secrets and include only the definitions needed to reproduce the result.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
